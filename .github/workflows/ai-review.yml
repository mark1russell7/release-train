# An AI review of each pull request, comment only (AI-REVIEW.md).
# Other repositories call mark1russell7/template/.github/workflows/reusable-ai-review.yml@<commit> # main
name: AI review

on:
  pull_request:
    # Not on each push: a new review comes from the ai-review label
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: mark1russell7/template/.github/workflows/reusable-ai-review.yml@e035fa69560ec82e176f1f7bdcb6760c8b15af54 # main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
