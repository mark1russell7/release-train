# The security scans of this repository (reusable-security.yml, CI.md): dependency review,
# osv-scanner and CodeQL. A pull request fails only for a new finding at or above high.
# Other repositories call mark1russell7/template/.github/workflows/reusable-security.yml@<commit> # main
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # A weekly scan finds the new advisories for the dependencies that do not change
  schedule:
    - cron: "57 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  security-ok:
    name: Security OK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: mark1russell7/template/.github/actions/security-scan@ddf7e495fc88b536e2ea89bb8271ac2d50b28baf # main

  # The one check of this file that the ruleset of main names, next to CI OK (CI.md of
  # mark1russell7/template, "The check of the ruleset"). The scans stay out of ci.yml, because
  # release.yml calls ci.yml with contents: read only.
