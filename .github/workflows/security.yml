# The security scans of this repository (reusable-security.yml, CI.md): dependency review,
# osv-scanner and CodeQL. A pull request fails only for a new finding at or above high.
# Other repositories call mark1russell7/template/.github/workflows/reusable-security.yml@<commit> # main
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # A weekly scan finds the new advisories for the dependencies that do not change
  schedule:
    - cron: "57 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: mark1russell7/template/.github/workflows/reusable-security.yml@3377b376fb6e39e4d65f130a98e74125d592f1f3 # main
    permissions:
      contents: read
      security-events: write
      actions: read

  # The one check of this file that the ruleset of main names, next to CI OK (CI.md of
  # mark1russell7/template, "The check of the ruleset"). The scans stay out of ci.yml, because
  # release.yml calls ci.yml with contents: read only.
  security-ok:
    name: Security OK
    if: always()
    needs: [security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each scan passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          ALLOW_SKIP: ""
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
