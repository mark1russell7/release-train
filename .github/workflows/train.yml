# The release train apply step (stage 2) and the template sync (stage 3). This workflow plans with the token of the GitHub App
# mark1russell7-release-train, so it sees the private repositories too. Then it opens or updates one pull request
# for each repository with an adoption of the current wave, and merges each green pull request.
# Privacy: the log, the step summary and the artifact give each private repository only as a count or a hash.
# The apply command also masks each private name in the log.
name: Train
# The title holds the urgent names, because a replaced run has no other record of them (packages/release-train/src/urgent.ts).
run-name: ${{ inputs.dry-run && 'Train dry run' || inputs.urgent != '' && format('Train urgent {0}', inputs.urgent) || inputs.only != '' && format('Train only {0}', inputs.only) || 'Train' }}

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Show the pull requests and change nothing.
        type: boolean
        default: true
      only:
        description: Change only these repositories (comma-separated). Empty means all.
        type: string
        default: ""
      cascade:
        description: The value of --cascade for this run (public names, "all" or "none"). Empty means CASCADE of the workflow.
        type: string
        default: ""
      urgent:
        description: The packages with a security fix (comma-separated public names). Their updates go first and pass the limit of pushes. Empty means none.
        type: string
        default: ""
  repository_dispatch:
    types: [released]
  schedule:
    - cron: "18,48 * * * *"

permissions:
  contents: read

concurrency:
  group: train
  cancel-in-progress: false

env:
  # The schedule and repository_dispatch change repositories only when LIVE is "true". Else they do a dry run.
  LIVE: "true"
  # The run starts the release workflows that start only by hand (for example with changesets) when RELEASE_DISPATCH
  # is "true". This needs the permission Actions: write of the GitHub App.
  RELEASE_DISPATCH: "true"
  # The public repositories (comma-separated) whose breaking adoptions carry a cascade release, "all", or "none".
  # The adoptions of other repositories with a cascade release wait.
  CASCADE: "all"
  # The run opens the template sync pull requests (branch release-train/template) when SYNC is "true".
  # The changes to workflow files wait until the GitHub App has the permission Workflows: write.
  SYNC: "true"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Make the token of the GitHub App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_KEY }}
          owner: ${{ github.repository_owner }}
      # This step fails when the App does not have the permission Workflows: write. The token of this step is not used.
      - name: Check the Workflows permission of the App
        id: wf
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_TRAIN_APP_ID }}
          private-key: ${{ secrets.RELEASE_TRAIN_APP_KEY }}
          owner: ${{ github.repository_owner }}
          permission-workflows: write
      - name: Find the commit author of the App
        id: bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "author=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - name: Plan and apply
        id: apply
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TRAIN_HASH_KEY: ${{ secrets.RELEASE_TRAIN_APP_KEY }}
          EVENT: ${{ github.event_name }}
          INPUT_DRY: ${{ inputs.dry-run }}
          ONLY: ${{ inputs.only }}
          INPUT_CASCADE: ${{ inputs.cascade }}
          URGENT: ${{ inputs.urgent }}
          OWNER: ${{ github.repository_owner }}
          AUTHOR: ${{ steps.bot.outputs.author }}
          WORKFLOWS: ${{ steps.wf.outcome == 'success' && 'yes' || 'no' }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then dry="$INPUT_DRY"; elif [ "$LIVE" = "true" ]; then dry=false; else dry=true; fi
          args=(apply --owner "$OWNER" --report apply.json --author "$AUTHOR" --holds lag-holds.json)
          if [ "$dry" != "false" ]; then args+=(--dry-run); else args+=(--take-replaced); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$URGENT" ]; then args+=(--urgent "$URGENT"); fi
          if [ "$RELEASE_DISPATCH" = "true" ]; then args+=(--release-dispatch); fi
          args+=(--cascade "${INPUT_CASCADE:-$CASCADE}")
          if [ "$SYNC" = "true" ]; then args+=(--workflows "$WORKFLOWS"); else args+=(--no-sync); fi
          node packages/release-train/src/bin.ts "${args[@]}"
      # When npm has a version in flight, the next wave starts at once with the released event.
      - name: Wait for a release
        if: steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: node packages/release-train/src/bin.ts await-release --owner "$OWNER" --report apply.json --minutes 15
      # The report has no private name: apply writes each private repository as a hash.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apply
          path: apply.json
          if-no-files-found: ignore
          retention-days: 14
